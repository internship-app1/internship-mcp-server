[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "internship-mcp"
version = "0.2.1"
description = "Vendor-neutral MCP server for the Internship Apply Agent — deterministic tools, all AI reasoning done by the calling agent, all PII kept local."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "cryptography>=42.0",
    "keyring>=24.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
internship-mcp = "internship_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["internship_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"internship_mcp/template.tex" = "internship_mcp/template.tex"

[tool.pytest.ini_options]
markers = ["parity: compile-engine parity tests (require pdflatex + backend checkout)"]
